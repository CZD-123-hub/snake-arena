<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>贪吃蛇大作战 · Snake Battle Royale</title>
<style>
  :root{
    --bg:#f4f6fa; --panel:#ffffff; --panel2:#eef2f8;
    --border:#d8e0ec; --text:#1a2332; --muted:#5c6b80;
    --green:#059669; --cyan:#0891b2; --amber:#d97706; --rose:#e11d48;
    --gold:#d97706; --silver:#94a3b8; --bronze:#b45309;
    --shadow:0 12px 40px -12px rgba(26,35,50,.22);
    --radius:16px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{
    background:
      radial-gradient(1200px 600px at 85% -10%,rgba(8,145,178,.08),transparent 60%),
      radial-gradient(1000px 500px at -10% 110%,rgba(5,150,105,.08),transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:"Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  #game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}

  .panel{
    position:fixed;background:var(--panel);border:1px solid var(--border);
    border-radius:var(--radius);padding:18px;z-index:10;
    box-shadow:var(--shadow);
  }

  #menu{
    top:50%;left:50%;transform:translate(-50%,-50%);
    width:min(440px,94vw);text-align:center;
    backdrop-filter:blur(12px);
  }
  #menu h1{font-size:36px;letter-spacing:.08em;font-weight:800;margin-bottom:4px;
    background:linear-gradient(135deg,#059669,#0891b2,#6366f1);-webkit-background-clip:text;background-clip:text;color:transparent}
  #menu h1 .ic{font-size:30px;margin-right:8px;background:none;-webkit-background-clip:initial;background-clip:initial;color:var(--green)}
  #menu .tagline{color:var(--muted);font-size:13px;margin-bottom:20px;letter-spacing:.08em}
  #menu .field-label{font-size:11px;color:var(--muted);letter-spacing:.14em;text-align:left;margin:14px 2px 8px}
  #menu input{
    width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);
    border-radius:12px;padding:12px 14px;font-size:15px;margin-bottom:4px;outline:none;
    font-family:inherit;text-align:center;transition:border-color .15s;
  }
  #menu input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(5,150,105,.12)}
  #skins{
    display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:16px;
  }
  .skin{
    aspect-ratio:1;border-radius:10px;cursor:pointer;border:2.5px solid var(--border);
    transition:transform .15s,border-color .15s,box-shadow .15s;position:relative;
  }
  .skin:hover{transform:translateY(-2px) scale(1.04)}
  .skin.sel{border-color:var(--green);box-shadow:0 0 0 3px rgba(5,150,105,.18)}
  .skin::after{content:'';position:absolute;inset:26% 12%;border-radius:6px;
    background:repeating-linear-gradient(90deg,rgba(255,255,255,.45) 0 6px,transparent 6px 12px)}
  .skin.dot::after{background:radial-gradient(circle,rgba(255,255,255,.55) 0 2.6px,transparent 3px);background-size:8px 8px}
  .skin.zebra::after{background:repeating-linear-gradient(45deg,rgba(255,255,255,.4) 0 5px,transparent 5px 11px)}
  .skin.plain::after{background:none}
  #menu .btn{
    width:100%;background:linear-gradient(135deg,#059669,#0d9488);color:#fff;border:none;border-radius:12px;
    padding:15px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:.06em;
    transition:transform .15s,filter .15s,box-shadow .15s;box-shadow:0 10px 26px -8px rgba(5,150,105,.55);
  }
  #menu .btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
  #menu .btn:active{transform:scale(.98)}
  #menu .btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--border);box-shadow:none}
  #roomRow{display:flex;gap:8px;margin-top:10px}
  #roomRow input{flex:1;margin:0;text-align:center;letter-spacing:.3em;font-size:16px}
  #menu .tip{margin-top:18px;color:var(--muted);font-size:12px;line-height:2}
  #menu .tip kbd{
    background:var(--panel2);border:1px solid var(--border);border-radius:5px;
    padding:1px 6px;font-size:10.5px;color:var(--text);
  }
  #menu .tip .em{font-size:13px}
  #stats{
    display:flex;gap:10px;justify-content:center;margin:14px 0 0;padding:10px;border-radius:12px;
    background:var(--panel2);font-size:12px;color:var(--muted);
  }
  #stats b{color:var(--text);font-size:14px;margin-left:2px}

  #hud{top:14px;left:14px;padding:12px 16px;display:flex;flex-direction:column;gap:7px;min-width:170px;
    backdrop-filter:blur(10px);border-radius:14px}
  #hud .row{display:flex;align-items:center;gap:8px}
  #hud .ic{width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;
    font-size:13px;background:var(--panel2)}
  #hud .lbl{color:var(--muted);font-size:10.5px;letter-spacing:.1em;flex:1}
  #hud .val{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--green);line-height:1}
  #hud .rank{color:var(--amber)}
  #hud .quit{
    margin-top:4px;background:var(--panel2);color:var(--muted);border:1px solid var(--border);
    border-radius:9px;padding:6px 0;font-size:12px;cursor:pointer;font-family:inherit;
    transition:background .15s,color .15s;
  }
  #hud .quit:hover{background:rgba(225,29,72,.08);color:var(--rose);border-color:rgba(225,29,72,.25)}
  #emotes{display:flex;gap:6px;margin-top:2px}
  #emotes button{
    flex:1;background:var(--panel2);border:1px solid var(--border);border-radius:9px;
    padding:5px 0;font-size:15px;cursor:pointer;transition:transform .1s,background .15s;
  }
  #emotes button:active{transform:scale(.9);background:rgba(5,150,105,.15)}

  #leaderboard{
    top:14px;right:14px;padding:12px 16px;min-width:196px;max-width:250px;
    backdrop-filter:blur(10px);border-radius:14px;
  }
  #leaderboard .title{font-size:11px;color:var(--muted);letter-spacing:.2em;margin-bottom:6px;
    display:flex;align-items:center;gap:6px}
  #leaderboard .title::before{content:'🏆';font-size:12px}
  #leaderboard .lb-row{display:flex;gap:8px;align-items:center;padding:3.5px 0;font-size:12.5px;
    border-radius:8px;padding-left:2px}
  #leaderboard .lb-row.lb-me{background:rgba(5,150,105,.07)}
  #leaderboard .lb-n{color:var(--muted);width:18px;text-align:right;font-variant-numeric:tabular-nums}
  #leaderboard .lb-n.top{font-weight:800}
  #leaderboard .lb-n[data-n="1"]{color:var(--gold)}
  #leaderboard .lb-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #leaderboard .lb-name.ai{color:var(--muted);font-style:italic}
  #leaderboard .lb-len{color:var(--muted);font-variant-numeric:tabular-nums}
  #leaderboard .lb-len b{color:var(--green);font-weight:700}
  #leaderboard .lb-me .lb-name{color:var(--green);font-weight:600}

  #death{
    top:50%;left:50%;transform:translate(-50%,-50%);width:min(360px,90vw);
    text-align:center;display:none;
    backdrop-filter:blur(12px);box-shadow:0 24px 70px -20px rgba(225,29,72,.3);
  }
  #roundEnd{
    top:50%;left:50%;transform:translate(-50%,-50%);width:min(380px,90vw);
    text-align:center;display:none;z-index:20;
    backdrop-filter:blur(12px);box-shadow:0 24px 70px -20px rgba(217,119,6,.35);
  }
  #roundEnd .sub{color:var(--muted);font-size:13px;margin-bottom:14px;line-height:2}
  #roundEnd .sub b{color:var(--text);font-size:15px}
  .hall-wrap{margin-top:14px;text-align:left;max-height:150px;overflow-y:auto}
  .hall-wrap .field-label{margin:0 0 6px;text-align:center}
  #hallBody{display:flex;flex-direction:column;gap:3px;font-size:12px}
  #hallBody .hb-row{display:flex;gap:8px;align-items:center;padding:3px 6px;border-radius:8px;background:var(--panel2)}
  #hallBody .hb-n{width:18px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
  #hallBody .hb-n.top{color:var(--amber);font-weight:700}
  #hallBody .hb-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #hallBody .hb-score{color:var(--amber);font-weight:700;font-variant-numeric:tabular-nums}
  #death h2{font-size:28px;margin-bottom:4px;
    background:linear-gradient(135deg,#e11d48,#f97316);-webkit-background-clip:text;background-clip:text;color:transparent}
  #death .sub{color:var(--muted);font-size:13px;margin-bottom:8px}
  #death .sub b{color:var(--text);font-size:15px}
  #death .rec{margin-bottom:16px;font-size:11.5px;color:var(--muted);background:var(--panel2);
    border-radius:10px;padding:8px;line-height:1.8}
  #death .rec b{color:var(--amber)}
  #death .btn,#pause .btn,#roundEnd .btn{
    width:100%;background:linear-gradient(135deg,#059669,#0d9488);color:#fff;border:none;border-radius:11px;
    padding:13px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:8px;
    transition:transform .12s,filter .12s;
  }
  #death .btn:hover,#pause .btn:hover,#roundEnd .btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
  #death .btn.ghost,#pause .btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--border)}

  #minimap{
    bottom:14px;right:14px;width:140px;height:140px;padding:0;overflow:hidden;
    background:rgba(255,255,255,.9);border-radius:14px;
  }
  #minimap canvas{width:100%;height:100%;display:block}

  #conn{
    top:14px;left:50%;transform:translateX(-50%);padding:7px 16px;font-size:11px;
    color:var(--muted);letter-spacing:.1em;border-radius:99px;
  }
  #conn.ok{color:var(--green);border-color:rgba(52,211,153,.4)}
  #conn.err{color:var(--rose);border-color:rgba(251,113,133,.4)}

  #streak{
    position:fixed;top:22%;left:50%;transform:translateX(-50%);z-index:20;display:none;
    font-size:44px;font-weight:900;letter-spacing:.06em;text-shadow:0 4px 24px rgba(5,150,105,.5);
    background:linear-gradient(135deg,#f59e0b,#e11d48);-webkit-background-clip:text;background-clip:text;color:transparent;
    pointer-events:none;animation:pop .35s ease-out;
  }
  @keyframes pop{0%{transform:translateX(-50%) scale(.4);opacity:0}60%{transform:translateX(-50%) scale(1.15);opacity:1}100%{transform:translateX(-50%) scale(1)}}
  #redflash{position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 30%,rgba(225,29,72,.55));opacity:0;pointer-events:none;z-index:5}
  #buffBar{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:8;display:flex;gap:8px;
  }
  #buffBar .bf{
    display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.92);border:1px solid var(--border);
    border-radius:99px;padding:5px 12px;font-size:13px;font-weight:700;box-shadow:var(--shadow);
    animation:pop .3s ease-out;
  }
  #buffsFx{display:flex;flex-direction:column;gap:6px;position:fixed;top:14px;left:50%;transform:translateX(-50%);
    z-index:9;align-items:center;pointer-events:none}
  #buffsFx .bff{background:rgba(5,150,105,.92);color:#fff;border-radius:99px;padding:6px 14px;font-size:13px;font-weight:700;
    box-shadow:0 6px 20px -6px rgba(5,150,105,.6);animation:pop .3s ease-out}
  #specBtn{display:none}
  /* 手机端操作按钮：由 body.touch-device 类控制（JS 判断触摸设备，不依赖 CSS 设备查询） */
  #actionZone{display:none;position:fixed;z-index:30;user-select:none;-webkit-user-select:none;touch-action:none;
    bottom:34px;right:22px;flex-direction:column;gap:14px;align-items:flex-end}
  body.touch-device #actionZone{display:flex}
  #actionZone .act-btn{
    width:78px;height:78px;border-radius:50%;border:none;cursor:pointer;font-family:inherit;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    font-size:22px;color:#fff;font-weight:700;
    background:rgba(8,145,178,.75);border:2px solid rgba(255,255,255,.5);
    box-shadow:0 8px 22px -6px rgba(8,145,178,.6);transition:transform .1s;
  }
  #actionZone .act-btn.boost{background:rgba(5,150,105,.8)}
  #actionZone .act-btn span{font-size:10px;letter-spacing:.05em}
  #actionZone .act-btn:active{transform:scale(.92)}
  /* ===== 手机触屏：竖屏布局 ===== */
  @media (orientation:portrait) and (pointer:coarse){
    #actionZone{bottom:30px;right:20px;gap:12px}
    #actionZone .act-btn{width:72px;height:72px;font-size:20px}
    #actionZone .act-btn span{font-size:9px}
    #leaderboard{top:12px;right:12px;min-width:148px;max-width:164px;padding:8px 10px}
    #leaderboard .lb-row{font-size:11px;padding:2.5px 0}
    #leaderboard .lb-name{max-width:66px}
    #minimap{top:auto;left:12px;bottom:12px;right:auto;width:96px;height:96px}
    #hud{top:12px;left:12px;padding:9px 12px;min-width:142px}
    #hud .val{font-size:19px}
    #hud .ic{width:19px;height:19px;font-size:11px}
    #hud .lbl{font-size:9.5px}
    #hud .quit{padding:4px 0;font-size:11px}
    #emotes button{padding:4px 0;font-size:14px}
  }
  /* ===== 手机触屏：横屏布局 ===== */
  @media (orientation:landscape) and (pointer:coarse){
    #actionZone{top:50%;right:12px;bottom:auto;transform:translateY(-50%);gap:10px}
    #actionZone .act-btn{width:60px;height:60px;font-size:18px}
    #actionZone .act-btn span{font-size:9px}
    #leaderboard{top:12px;right:12px;min-width:150px;max-width:172px;padding:8px 10px}
    #leaderboard .lb-row{font-size:11px;padding:2.5px 0}
    #leaderboard .lb-name{max-width:74px}
    #minimap{top:auto;left:12px;bottom:12px;right:auto;width:88px;height:88px}
    #hud{top:12px;left:12px;padding:9px 12px;min-width:138px}
    #hud .val{font-size:18px}
    #hud .ic{width:18px;height:18px;font-size:11px}
    #hud .lbl{font-size:9.5px}
    #hud .quit{padding:4px 0;font-size:11px}
    #emotes button{padding:4px 0;font-size:13px}
  }
  #killfeed{
    position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:12;display:flex;flex-direction:column;
    gap:4px;align-items:center;pointer-events:none;width:min(420px,92vw);
  }
  #killfeed .kf{
    background:rgba(255,255,255,.94);border:1px solid var(--border);border-radius:99px;
    padding:5px 16px;font-size:12.5px;font-weight:600;box-shadow:var(--shadow);
    animation:kfIn .25s ease-out, kfOut .4s ease-in 3.2s forwards;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;
  }
  @keyframes kfIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
  @keyframes kfOut{to{opacity:0;transform:translateY(-6px)}}
  #killfeed .kf .kn{color:var(--rose);font-weight:700}
  #killfeed .kf .tn{color:var(--muted)}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="redflash"></div>

<div class="panel" id="conn">正在连接服务器…</div>

<div class="panel" id="menu">
  <h1><span class="ic">🐍</span>贪吃蛇大作战</h1>
  <div class="tagline">多人实时竞技 · 活到最后就是王</div>
  <input id="name" maxlength="12" placeholder="输入你的名字" autocomplete="off">
  <div class="field-label">选择皮肤</div>
  <div id="skins"></div>
  <div class="field-label">房间（留空=随机匹配）</div>
  <div id="roomRow">
    <input id="room" maxlength="6" placeholder="6位房间码" autocomplete="off">
    <button class="btn ghost" id="roomBtn" style="width:110px;padding:12px 0;font-size:13px">🎲 开房</button>
  </div>
  <div style="height:14px"></div>
  <button class="btn" id="startBtn">⚔️ 进入战场</button>
  <div class="tip">
    <span class="em">🖱️</span> 鼠标转向 · <kbd>按住左键</kbd> / <kbd>空格</kbd> 加速<br>
    <span class="em">📱</span> 手机：一根手指转向，第二根手指加速<br>
    <span class="em">💡</span> 吃球长大 · 大蛇吃小蛇 · 撞墙出局 · 拾取道具
  </div>
  <div id="stats"></div>
  <div class="hall-wrap" id="hallWrap" style="display:none">
    <div class="field-label">🏆 名人堂 · 本服历史</div>
    <div id="hallBody"></div>
  </div>
</div>

<div class="panel" id="hud" style="display:none">
  <div class="row"><span class="ic">📏</span><span class="lbl">长度</span><span class="val" id="myLen">12</span></div>
  <div class="row"><span class="ic">⭐</span><span class="lbl">经验</span><span class="val" id="myScore" style="color:var(--amber)">0</span></div>
  <div class="row"><span class="ic">💀</span><span class="lbl">击杀</span><span class="val" id="myKills" style="color:var(--rose)">0</span></div>
  <div class="row" id="roomRowHud" style="display:none"><span class="ic">🚪</span><span class="lbl">房间</span><span class="val" id="roomVal" style="color:var(--cyan);font-size:17px">-</span></div>
  <div class="row"><span class="ic">🏅</span><span class="lbl">排名</span><span class="val rank" id="myRank">?</span></div>
  <div class="row"><span class="ic">👥</span><span class="lbl">在线</span><span class="val" id="online" style="color:var(--cyan)">0</span></div>
  <div id="emotes">
    <button data-em="😀">😀</button>
    <button data-em="💪">💪</button>
    <button data-em="☠️">☠️</button>
  </div>
  <button class="quit" id="quitBtn">⏸ 退出</button>
</div>

<div class="panel" id="leaderboard" style="display:none">
  <div class="title">实时排行榜<span id="roundTimer" style="float:right;color:var(--amber);font-weight:700">--:--</span></div>
  <div id="lbBody"></div>
</div>

<div class="panel" id="minimap" style="display:none"><canvas id="mm"></canvas></div>

<div id="buffsFx"></div>
<div id="buffBar"></div>
<div id="streak"></div>
<div id="killfeed"></div>

<!-- 手机端操作按钮：加速在上方（最常用），冲刺在下方 -->
<div id="actionZone">
  <button id="boostBtn" class="act-btn boost">🚀<span>加速</span></button>
  <button id="dashBtn" class="act-btn">⚡<span>冲刺</span></button>
</div>

<div class="panel" id="death">
  <h2>💥 你出局了</h2>
  <div class="sub">本局长度 <b id="dLen">0</b> · 经验 <b id="dScore">0</b> · 击杀 <b id="dKills">0</b> · 排名 <b id="dRank">?</b></div>
  <div class="rec" id="dRec"></div>
  <button class="btn" id="respawnBtn">🔄 再来一局</button>
  <button class="btn ghost" id="specBtn">👁️ 观战第一名</button>
  <button class="btn ghost" id="menuBtn">🏠 返回菜单</button>
</div>

<div class="panel" id="pause" style="display:none">
  <h2 style="background:linear-gradient(135deg,#0891b2,#059669);-webkit-background-clip:text;background-clip:text;color:transparent">⏸ 暂停</h2>
  <div class="sub">当前长度 <b id="pLen">0</b> · 经验 <b id="pScore">0</b> · 排名 <b id="pRank">?</b></div>
  <button class="btn" id="resumeBtn">▶ 继续游戏</button>
  <button class="btn ghost" id="restartBtn">🔄 重新开始</button>
  <button class="btn ghost" id="pauseMenuBtn">🏠 返回主页</button>
</div>

<div class="panel" id="roundEnd" style="display:none">
  <h2 style="background:linear-gradient(135deg,#d97706,#e11d48);-webkit-background-clip:text;background-clip:text;color:transparent">⏱ 本轮结束</h2>
  <div class="sub" id="reRank"></div>
  <button class="btn" id="reNext">⚔️ 进入下一轮</button>
</div>

<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
// 触摸设备检测：有 ontouchstart 或移动端 UA → 加类显示操作按钮（横竖屏都可靠）
(function(){
  const touch=('ontouchstart'in window)||/Mobi|Android|iPhone|iPad|Windows Phone/i.test(navigator.userAgent);
  if(touch)document.body.classList.add('touch-device');
})();
let W=0,H=0,DPR=1;
function resize(){
  // 移动端用 1.5x 减少渲染像素量（性能），桌面保持 2x
  DPR=Math.min(2,window.devicePixelRatio||1);
  if(/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent))DPR=Math.min(1.5,DPR||1);
  W=innerWidth;H=innerHeight;
  canvas.width=W*DPR;canvas.height=H*DPR;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}

// ---------- 音效（Web Audio 合成） ----------
let actx=null;
function audio(){
  if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}
  if(actx.state==='suspended')actx.resume();
  return actx;
}
function tone(f,dur,type,vol,slide){
  const ac=audio();if(!ac)return;
  try{
    const o=ac.createOscillator(),g=ac.createGain();
    o.type=type||'sine';
    o.frequency.setValueAtTime(f,ac.currentTime);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),ac.currentTime+dur);
    g.gain.setValueAtTime(vol||.15,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);
    o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+dur);
  }catch(e){}
}

  streak(n){const fs=[523,659,784];tone(fs[Math.min(n-2,2)]||660,.22,'square',.2,180)},
  pickup(){tone(880,.09,'sine',.14,500)},

function connect(){
  const proto=location.protocol==='https:'?'wss://':'ws://';
  ws=new WebSocket(proto+location.host);
  ws.onopen=()=>{
    state.connected=true;
    $('conn').textContent='已连接 · 正在进入战场...';
    $('conn').classList.add('ok');
    if(state.pendingJoin){state.pendingJoin=false;sendJoin()}
  };
  ws.onmessage=e=>{
    let msg;try{msg=JSON.parse(e.data)}catch(err){return}
    handle(msg);
  };
  ws.onclose=()=>{
    state.connected=false;
    // 对局中断线：自动重连（30s 内凭 token 恢复原位）
    if(state.inGame&&state.sessionToken){
      $('conn').style.display='block';
      $('conn').textContent='连接断开，正在自动重连...';
      $('conn').classList.remove('ok');$('conn').classList.add('err');
      reconnect();
    }else{
      state.inGame=false;
      $('conn').textContent='连接断开，请刷新重连';
      $('conn').classList.remove('ok');$('conn').classList.add('err');
      showMenu();
    }
  };
}
// 断线自动重连：指数退避（0.5s→1s→2s→4s→5s，共 5 次≈12.5s），30s 服务端保留窗口内必能恢复
let reconnectAttempts=0,reconnectTimer=null;
function reconnect(){
  if(reconnectAttempts>=5){state.inGame=false;showMenu();return}
  reconnectAttempts++;
  clearTimeout(reconnectTimer);
  reconnectTimer=setTimeout(()=>{
    const proto=location.protocol==='https:'?'wss://':'ws://';
    const w=new WebSocket(proto+location.host);
    w.onopen=()=>{
      w.send(JSON.stringify({type:'rejoin',token:state.sessionToken,room:state.roomCode,name:myNameVal,skin:mySkin||''}));
    };
    w.onmessage=e=>{
      let msg;try{msg=JSON.parse(e.data)}catch(err){return}
      if(msg.type==='init'){
        ws=w;state.connected=true;reconnectAttempts=0;
        $('conn').style.display='none';
        handle(msg);
      }else{
        handle(msg);
      }
    };
    w.onclose=()=>reconnect();
    w.onerror=()=>{try{w.close()}catch(e){}};
  },Math.min(500*Math.pow(2,reconnectAttempts-1),5000));
}

function handle(msg){
  switch(msg.type){
    case 'init':
      state.selfId=msg.selfId;state.selfColor=msg.selfColor;
      state.roomCode=msg.room||'';
      state.sessionToken=msg.token||'';
      // 重连/新局恢复：清除暂停与轮次面板残留（服务端已同步 paused=false）
      state.paused=false;
      $('pause').style.display='none';
      $('roundEnd').style.display='none';
      // 对战界面显示房间号（全球场不显示）
      const rc=(msg.room||'').toUpperCase();
      if(rc&&rc!=='GLOBAL'){
        $('roomVal').textContent=rc;
        $('roomRowHud').style.display='flex';
      }else{
        $('roomRowHud').style.display='none';
      }
      state.snakes.clear();state.foods.clear();state.items.clear();state.corpses.clear();
      for(const s of msg.snakes)state.snakes.set(s.id,s);
      for(const f of msg.foods)state.foods.set(f.id,f);
      if(msg.items)for(const it of msg.items)state.items.set(it.id,it);
      if(msg.corpses)for(const cp of msg.corpses)state.corpses.set(cp.id,cp);
      enterGame();
      break;
    case 'state':
      state.lastStateAt=performance.now();
      for(const s of msg.snakes){
        const old=state.snakes.get(s.id);
        const nowT=performance.now();
        const inDashBuf=s.id===state.selfId&&old&&old._dashUntil&&nowT<old._dashUntil;
        if(s.id===state.selfId&&old&&old.points&&old.points.length>1&&!inDashBuf){
          const h=old.points[0],sh=s.points[0];
          if(sh&&Math.hypot(h[0]-sh[0],h[1]-sh[1])>90){
            // 校正：不瞬间替换，设平滑拉回目标（本地预测逐帧向服务端位置过渡）
            old._corr=densify(s.points);
          }
          old.len=s.len;old.score=s.score;old.boost=s.boost;old.name=s.name;old.color=s.color;
          old.kills=s.kills;old.prot=s.prot;old.fx=s.fx;
          state.snakes.set(s.id,old);
        }else{
          // 冲刺缓冲期/其他蛇：走服务端插值（更新 points + 时间戳）
          const cp=Object.assign({prev:old||null},s);
          cp._prevT=(old&&old._pt)||(nowT-50);
          cp._pt=nowT;
          state.snakes.set(s.id,cp);
        }
      }
      const aliveIds=new Set(msg.snakes.map(s=>s.id));
      for(const id of [...state.snakes.keys()])if(!aliveIds.has(id))state.snakes.delete(id);
      for(const f of msg.fadd)state.foods.set(f.id,f);
      for(const id of msg.fdel)state.foods.delete(id);
      if(msg.iadd)for(const it of msg.iadd)state.items.set(it.id,it);
      if(msg.idel)for(const id of msg.idel)state.items.delete(id);
      // 尸体全量同步（幂等覆盖）
      if(msg.corpses){
        const cids=new Set(msg.corpses.map(c=>c.id));
        for(const id of [...state.corpses.keys()])if(!cids.has(id))state.corpses.delete(id);
        for(const cp of msg.corpses)state.corpses.set(cp.id,cp);
      }
      if(msg.rank&&msg.rank.length){
        state.rank=msg.rank;
        const me=msg.rank.findIndex(r=>r.id===state.selfId);
        state.myRank=me>=0?me+1:'?';
        $('myRank').textContent=state.myRank;
        renderLeaderboard();
      }
      if(msg.online!=null)$('online').textContent=msg.online;
      if(msg.roundRemain!=null){
        const m=Math.floor(msg.roundRemain/60),sec=msg.roundRemain%60;
        $('roundTimer').textContent=(m<10?'0':'')+m+':'+(sec<10?'0':'')+sec;
      }
      const selfSnake=state.snakes.get(state.selfId);
      if(selfSnake&&selfSnake.score!=null)$('myScore').textContent=Math.floor(selfSnake.score);
      if(selfSnake&&selfSnake.kills!=null)$('myKills').textContent=selfSnake.kills;
      if(msg.eats)for(const e of msg.eats){
        if(e.id===state.selfId)continue; // 自己蛇已本地乐观吃球，跳过重复动画
        for(const f of e.f)if(f.x!=null)explode(f.x,f.y,f.big?'#f59e0b':'#fbbf24',f.big?8:4);
      }
      break;
    case 'death':
      if(msg.id===state.selfId){showDeath();return}
      state.snakes.delete(msg.id);
      if(msg.x!=null){
        explode(msg.x,msg.y,msg.why&&msg.why.startsWith('eaten')?'#f59e0b':'#fb7185',26);
        if(msg.why==='wall')SFX.wall();
      }
      break;
    case 'eat':
      if(msg.x!=null)explode(msg.x,msg.y,'#22d3ee',18);
      if(msg.killer===state.selfId)SFX.kill();
      // 击杀播报
      if(msg.killerName&&msg.targetName)addKillFeed(msg.killerName,msg.targetName);
      break;
    case 'killstreak':
      if(msg.killer===state.selfId){
        SFX.streak(msg.count);
        showStreak(msg.count);
      }
      break;
    case 'item':
      if(msg.id===state.selfId){
        SFX.pickup();
        showBuffTip(ITEM_META[msg.kind]);
      }
      break;
    case 'corpseEat':
      if(msg.x!=null)explode(msg.x,msg.y,'#a78bfa',20);
      if(msg.id===state.selfId)SFX.kill();
      break;
    case 'dash':
      if(msg.id===state.selfId){
        SFX.pickup();
        const me=state.snakes.get(state.selfId);
        if(me){
          // 本地同步瞬移：预测点整体平移，保持与服务端一致
          if(msg.dx||msg.dy){
            for(const p of me.points){p[0]+=msg.dx;p[1]+=msg.dy}
            me.x+=msg.dx;me.y+=msg.dy;
          }
          me._corr=null;
          // 同步服务端方向：缓冲期结束后本地预测无缝衔接
          if(Number.isFinite(msg.a))state.selfAngle=msg.a;
          // 冲刺后 400ms 切服务端插值渲染（平滑接管），防止本地预测方向偏离累积抖动
          me._dashUntil=performance.now()+400;
        }
        dashTrail(msg.x,msg.y,state.selfAngle);
      }
      break;
    case 'emote':
      if(msg.id!==state.selfId){
        const s=state.snakes.get(msg.id);
        if(s){s.emote=msg.em;s.emoteUntil=Date.now()+2500;SFX.emote()}
      }
      break;
    case 'roundEnd':
      showRoundEnd(msg.rank||[]);
      break;
    case 'gameover':
      $('dLen').textContent=msg.len;
      $('dScore').textContent=msg.score||'0';
      $('dKills').textContent=msg.kills||'0';
      $('dRank').textContent=msg.rank>0?msg.rank:'?';
      // 战绩记录
      stats.games=(stats.games||0)+1;
      stats.kills=(stats.kills||0)+(msg.kills||0);
      stats.maxLen=Math.max(stats.maxLen||0,msg.len||0);
      saveStats();
      $('dRec').innerHTML=`生涯：击杀 <b>${stats.kills}</b> · 最长 <b>${stats.maxLen}</b> · 场次 <b>${stats.games}</b>`;
      renderStats();
      break;
  }
}

function addKillFeed(killerName,targetName){
  const feed=$('killfeed');
  const el=document.createElement('div');

function joyStart(e){
  e.preventDefault();
  for(const t of e.changedTouches){
    if(joy.joyId<0){
      joy.joyId=t.identifier;joy.active=true;joy.cx=t.clientX;joy.cy=t.clientY;joy.dx=0;joy.dy=0;
    }else if(joy.boostId<0){
      joy.boostId=t.identifier;state.boosting=true;

function joyMove(e){
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier===joy.joyId){
      let dx=t.clientX-joy.cx,dy=t.clientY-joy.cy;
      const d=Math.hypot(dx,dy);
      if(d>42){dx=dx/d*42;dy=dy/d*42}
      joy.dx=dx;joy.dy=dy;
    }
  }
}
function joyEnd(e){
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier===joy.joyId){joy.joyId=-1;joy.active=false;joy.dx=0;joy.dy=0;}
    if(t.identifier===joy.boostId){joy.boostId=-1;state.boosting=false;}
  }
}

function computeInput(){
  const me=state.snakes.get(state.selfId);
  if(!me)return;
  const vs=state.scale||1;
  const screenX=(me.x-state.camX)*vs+W/2;
  const screenY=(me.y-state.camY)*vs+H/2;
  if(joy.active&&(Math.abs(joy.dx)>8||Math.abs(joy.dy)>8)){
    state.targetAngle=Math.atan2(joy.dy,joy.dx);
  }else{
    state.targetAngle=Math.atan2(state.mouse.y-screenY,state.mouse.x-screenX);
  }
  let d=state.targetAngle-state.selfAngle;
  while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;
  state.selfAngle=state.selfAngle+d*0.12;
}

const gridSize=100;

// 服务端采样点加密：每段中间插 2 个点，匹配本地预测密度（×3），防校正跳变
function densify(pts){
  if(!pts||pts.length<2)return pts;
  const out=[pts[0].slice()];
  for(let i=1;i<pts.length;i++){
    const a=pts[i-1],b=pts[i];
    for(let k=1;k<=3;k++){
      out.push([a[0]+(b[0]-a[0])*k/3,a[1]+(b[1]-a[1])*k/3]);
    }
  }
  return out;
}

let lastFrameT=performance.now();
function localPredict(){
  const me=state.snakes.get(state.selfId);
  if(!me||!me.points||me.points.length<2||!state.inGame||state.paused||state.spectate)return;
  // 冲刺缓冲期内暂停本地预测（由服务端插值接管，避免方向偏离累积抖动）
  if(me._dashUntil&&performance.now()<me._dashUntil)return;
  const now=performance.now();
  const dt=Math.min(0.1,(now-lastFrameT)/1000);
  lastFrameT=now;
  const h=me.points[0];
  const sp=(state.boosting?5.6:3.4)*dt*20;
  const nx=h[0]+Math.cos(state.selfAngle)*sp;
  const ny=h[1]+Math.sin(state.selfAngle)*sp;
  const c=Math.max(11,Math.min(WORLD-11,nx));
  const cy=Math.max(11,Math.min(WORLD-11,ny));
  me.points.unshift([c,cy]);
  // keep 用未取整的 score 计算：len 是服务端取整值，衰减时会在整数边界来回跳导致尾部伸缩抖动
  const keep=Math.max(40,Math.floor((12+(me.score||0))*1.5)+30);
  while(me.points.length>keep)me.points.pop();
  me.x=c;me.y=cy;
  me._predicted=true;
  // 服务端校正平滑拉回：points 逐点向校正目标过渡，无跳变
  if(me._corr&&me._corr.length>1){
    const n=Math.min(me.points.length,me._corr.length);
    let done=true;
    for(let i=0;i<n;i++){
      me.points[i][0]+=(me._corr[i][0]-me.points[i][0])*0.12;
      me.points[i][1]+=(me._corr[i][1]-me.points[i][1])*0.12;
      if(Math.abs(me._corr[i][0]-me.points[i][0])>2)done=false;
    }
    if(done)me._corr=null;
  }
  // 乐观吃球/拾取：每 2 帧检查一次（30fps 足够，33ms 乐观延迟远小于网络延迟，省一半遍历开销）
  state._eatTick=(state._eatTick||0)+1;
  if(state._eatTick%2===0){
    for(const [id,f] of state.foods){
      const dx=c-f.x,dy=cy-f.y;
      const eatR=f.big?18:13;
      if(dx*dx+dy*dy<eatR*eatR){
        state.foods.delete(id);
        explode(f.x,f.y,f.big?'#f59e0b':'#fbbf24',f.big?8:4);
        if(f.big)SFX.bigEat();else SFX.eat();
      }
    }
    // 乐观拾取道具：本地立即删+特效，服务端稍后确认
    for(const [id,it] of state.items){
      const dx=c-it.x,dy=cy-it.y;
      if(dx*dx+dy*dy<16*16){
        state.items.delete(id);
        explode(it.x,it.y,ITEM_META[it.kind]?.color||'#94a3b8',10);
      }
    }
  }
}

// 全局关闭 shadowBlur（canvas 每像素模糊 = 帧时间最大杀手，光效改用双层圆伪光晕替代）
// 保留 SHADOW 变量便于将来按设备/画质档位恢复
const SHADOW=0;
// 世界边框渐变：端点固定（世界坐标），模块级缓存一次，消除每帧重建
const WALL_GRAD=(()=>{
  const g=ctx.createLinearGradient(20,20,WORLD-20,WORLD-20);
  g.addColorStop(0,'rgba(225,29,72,.7)');
  g.addColorStop(.5,'rgba(217,119,6,.7)');
  g.addColorStop(1,'rgba(8,145,178,.7)');
  return g;
})();
function draw(){
  // 帧时间监控（自适应降级 + 性能 HUD）
  const _ft0=performance.now();
  localPredict();
  // 摄像机：正常跟随自己；观战时跟随第一名
  const me=state.snakes.get(state.selfId);
  const focus=state.spectate?specTarget():me;
  if(focus){
    state.camX+=(focus.x-state.camX)*0.1;
    state.camY+=(focus.y-state.camY)*0.1;
  }
  // 镜头缩放：蛇越长视野越大（slither 式成长感）
  const fLen=focus?(focus.len||12):12;
  const scale=Math.max(0.6,Math.min(1,1-(fLen-12)*0.004));
  state.scale=scale;
  // 死亡震动
  let shx=0,shy=0;
  if(Date.now()<state.shakeUntil){
    shx=(Math.random()-0.5)*state.shake;
    shy=(Math.random()-0.5)*state.shake;
  }
  const ox=-state.camX*scale+W/2+shx,oy=-state.camY*scale+H/2+shy;

  ctx.fillStyle='#f4f6fa';
  ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.translate(ox,oy);
  ctx.scale(scale,scale);

  ctx.strokeStyle='rgba(92,107,128,.12)';ctx.lineWidth=1;
  const x0=Math.floor((state.camX-W/2/scale)/gridSize)*gridSize;
  const y0=Math.floor((state.camY-H/2/scale)/gridSize)*gridSize;
  ctx.beginPath();
  for(let x=x0;x<state.camX+W/2/scale+gridSize;x+=gridSize){
    ctx.moveTo(x,state.camY-H/2/scale);ctx.lineTo(x,state.camY+H/2/scale);
  }
  for(let y=y0;y<state.camY+H/2/scale+gridSize;y+=gridSize){
    ctx.moveTo(state.camX-W/2/scale,y);ctx.lineTo(state.camX+W/2/scale,y);
  }
  ctx.stroke();

  ctx.strokeStyle=WALL_GRAD;ctx.lineWidth=5;
  ctx.strokeRect(18,18,WORLD-36,WORLD-36);

  // 中心富食区提示（淡淡光圈）
  const centerR=WORLD*0.28;
  ctx.fillStyle='rgba(217,119,6,.04)';
  ctx.beginPath();ctx.arc(WORLD/2,WORLD/2,centerR,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(217,119,6,.12)';ctx.lineWidth=2;ctx.setLineDash([10,8]);
  ctx.beginPath();ctx.arc(WORLD/2,WORLD/2,centerR,0,Math.PI*2);ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='rgba(217,119,6,.3)';ctx.font='13px system-ui';ctx.textAlign='center';
  ctx.fillText('富食区 · 食物最密集',WORLD/2,WORLD/2);

  // 道具（双层圆伪光晕：外层低透明度 + 内层实色，替代 shadowBlur 保留光感；低画质只画内层）
  const vs=state.scale||1;
  const glow=(state.quality||2)>=1;
  for(const it of state.items.values()){
    if(it.x<state.camX-W/2/vs-40||it.x>state.camX+W/2/vs+40||it.y<state.camY-H/2/vs-40||it.y>state.camY+H/2/vs+40)continue;
    const meta=ITEM_META[it.kind]||{e:'?',color:'#94a3b8'};
    const pulse=1+Math.sin(Date.now()/260+it.x)*0.12;
    ctx.fillStyle=meta.color;
    if(glow){
      ctx.globalAlpha=0.18;
      ctx.beginPath();ctx.arc(it.x,it.y,20*pulse,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=1;
    }
    ctx.beginPath();ctx.arc(it.x,it.y,13*pulse,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';
    ctx.font='14px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(meta.e,it.x,it.y+1);
    ctx.textBaseline='alphabetic';
  }

  // 食物
  for(const f of state.foods.values()){
    if(f.x<state.camX-W/2/vs-30||f.x>state.camX+W/2/vs+30||f.y<state.camY-H/2/vs-30||f.y>state.camY+H/2/vs+30)continue;
    if(f.big){
      const pulse=1+Math.sin(Date.now()/300+f.x)*0.15;
      ctx.fillStyle='#f59e0b';
      if(glow){
        ctx.globalAlpha=0.2;
        ctx.beginPath();ctx.arc(f.x,f.y,12*pulse,0,Math.PI*2);ctx.fill();
        ctx.globalAlpha=1;
      }
      ctx.beginPath();ctx.arc(f.x,f.y,7*pulse,0,Math.PI*2);ctx.fill();
    }else{
      ctx.fillStyle='#d97706';
      ctx.beginPath();ctx.arc(f.x,f.y,3.2,0,Math.PI*2);ctx.fill();
    }
  }

  // 尸体流（死亡蛇身，半透明肉条）
  for(const cp of state.corpses.values()){
    if(!cp.points||cp.points.length<2)continue;
    const hp=cp.points[0];
    if(hp[0]<state.camX-W/2/vs-200||hp[0]>state.camX+W/2/vs+200||hp[1]<state.camY-H/2/vs-200||hp[1]>state.camY+H/2/vs+200)continue;
    ctx.globalAlpha=0.7;
    ctx.strokeStyle=cp.color||'#94a3b8';
    ctx.lineWidth=9;
    ctx.lineCap='round';ctx.lineJoin='round';
    ctx.beginPath();
    ctx.moveTo(cp.points[0][0],cp.points[0][1]);
    for(let i=1;i<cp.points.length;i++)ctx.lineTo(cp.points[i][0],cp.points[i][1]);
    ctx.stroke();
    ctx.globalAlpha=1;
  }

  // 蛇：自己用本地预测渲染点（平滑缓冲防跳变）；其他蛇时间缓冲插值
  // 统一用"补齐/截断 + lerp"：点数量变化时也平滑，头部永不跳变
  const nowT=performance.now();
  const RENDER_DELAY=90; // 渲染延迟缓冲（ms）：看"过去 90ms"的位置，两包之间匀速插值
  for(const s of state.snakes.values()){
    if(state.spectate&&s.id===state.selfId)continue;
    const isMe=s.id===state.selfId;
    const inDashBuf=isMe&&s._dashUntil&&nowT<s._dashUntil;
    if(s.points&&s.points.length>1){
      if(isMe&&!inDashBuf){
        // 自己（非冲刺缓冲期）：直接用本地预测点（逐帧平滑推进）
        drawSnake(s,true,s.points);
      }else if(s.prev&&s.prev.points&&s.prev.points.length>1&&s._pt&&s._prevT){
        // 其他蛇 / 冲刺缓冲期的自己：按时间在两包之间插值（固定延迟缓冲，匀速平滑）
        // 插值永远是平滑核心，不随画质档位关闭（降档只影响光晕/粒子等次要特效）
        // 插值缓冲复用（_ipts 预分配）：消除每帧 new Array + 内层数组的 GC 压力
        const span=Math.max(20,s._pt-s._prevT);
        const f=Math.min(1,Math.max(0,(nowT-RENDER_DELAY-s._prevT)/span));
        const pc=s.prev.points,cc=s.points;
        const n=Math.min(pc.length,cc.length);
        if(!s._ipts||s._ipts.length!==cc.length){
          s._ipts=new Array(cc.length);
          for(let i=0;i<cc.length;i++)s._ipts[i]=[0,0];
        }
        const pts=s._ipts;
        for(let i=0;i<cc.length;i++){
          const q=pc[Math.min(i,n-1)]||cc[i];
          pts[i][0]=q[0]+(cc[i][0]-q[0])*f;
          pts[i][1]=q[1]+(cc[i][1]-q[1])*f;
        }
        drawSnake(s,isMe,pts);
      }else{
        drawSnake(s,isMe);
      }
    }else{
      drawSnake(s,isMe);
    }
  }
  drawParticles();
  ctx.restore();

  // 浮动摇杆：手指按下处出现摇杆盘，拖动转向（手机/触摸屏）
  if(joy.active){
    ctx.strokeStyle='rgba(26,35,50,.25)';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(joy.cx,joy.cy,42,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.35)';
    ctx.beginPath();ctx.arc(joy.cx,joy.cy,42,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(5,150,105,.5)';
    ctx.beginPath();ctx.arc(joy.cx+joy.dx,joy.cy+joy.dy,16,0,Math.PI*2);ctx.fill();
  }

  renderBuffs();
  drawMinimap();
  // 帧时间监控：120 帧滑动窗口，avg>24ms 降一档 / <13ms 恢复（宽滞回防临界抖动）
  // 降档只影响光晕/粒子等次要特效，不影响插值（插值是平滑核心，永不关闭）
  const _ft=performance.now()-_ft0;
  state._ft=(state._ft||0)+_ft;
  state._ftN=(state._ftN||0)+1;
  if(state._ftN>=120){
    const avg=state._ft/state._ftN;
    state._ft=0;state._ftN=0;
    const q=state.quality==null?2:state.quality;
    if(avg>24)state.quality=Math.max(0,q-1);
    else if(avg<13)state.quality=Math.min(2,q+1);
  }
  // 性能 HUD（?perf=1 开启）：帧时间/FPS/画质档位，用于真机验证流畅度
  if(state._perf){
    state._pft=(state._pft||0)+_ft;
    state._pN=(state._pN||0)+1;
    if(state._pft>500){
      const avg=state._pft/state._pN;
      state._pft=0;state._pN=0;
      const el=document.getElementById('perfHud');
      if(el)el.textContent='帧 '+(1000/avg).toFixed(0)+'fps · '+avg.toFixed(1)+'ms · 画质Q'+(state.quality==null?2:state.quality);
    }
  }
  requestAnimationFrame(draw);
}

// ---------- 粒子系统 ----------
const particles=[];
function explode(x,y,color,n){
  const cap=(state.quality||2)>=1?180:80;
  if(particles.length>cap)return;
  const m=(state.quality||2)>=1?1:0.6; // 低画质粒子密度降 40%
  const nn=Math.max(1,Math.round(n*m));
  for(let i=0;i<nn;i++){
    const a=Math.random()*Math.PI*2,sp=1+Math.random()*3.5;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,decay:0.03+Math.random()*0.03,color,r:2+Math.random()*3.5});
  }
}
function drawParticles(){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx;p.y+=p.vy;p.vx*=0.96;p.vy*=0.96;p.life-=p.decay;
    if(p.life<=0){
      // swap-pop 删除（O(1)，无数组元素移动）
      const last=particles.pop();
      if(i<particles.length)particles[i]=last;
      continue;
    }
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}
// 冲刺残影：沿冲刺方向撒一条光带
function dashTrail(x,y,angle){
  for(let i=0;i<16;i++){
    const back=i*7;
    const px=x-Math.cos(angle)*back,py=y-Math.sin(angle)*back;
    particles.push({x:px,y:py,vx:(Math.random()-0.5)*1.5,vy:(Math.random()-0.5)*1.5,
      life:0.7-i*0.03,decay:0.05,color:'#22d3ee',r:3+Math.random()*2});
  }
}

function drawSnake(s,isMe,usePts){
  // 远距离点模式：AOI 视野外蛇只有头部信息，渲染为小圆点+名字（细节远距离无感）
  if(!usePts&&(!s.points||s.points.length<2)){
    if(s.x==null||s.y==null)return;
    if(s.x<state.camX-W/2/(state.scale||1)-40||s.x>state.camX+W/2/(state.scale||1)+40||s.y<state.camY-H/2/(state.scale||1)-40||s.y>state.camY+H/2/(state.scale||1)+40)return;
    ctx.fillStyle=s.color||'#94a3b8';
    ctx.beginPath();ctx.arc(s.x,s.y,5,0,Math.PI*2);ctx.fill();
    if(s.name){
      ctx.font='10px system-ui';ctx.textAlign='center';
      ctx.fillStyle='rgba(26,35,50,.55)';
      ctx.fillText(s.name,s.x,s.y-11);
    }
    return;
  }
  if(!s.points||s.points.length<2)return;
  const pts=usePts||s.points;
  const h=pts[0];
  if(h[0]<state.camX-W/2/(state.scale||1)-200||h[0]>state.camX+W/2/(state.scale||1)+200||h[1]<state.camY-H/2/(state.scale||1)-200||h[1]>state.camY+H/2/(state.scale||1)+200)return;
  let body=s.color;
  let pat='stripe';
  if(s.skin){const sk=skinOf(s.skin);body=sk.color;pat=sk.pattern}
  const r=Math.min(16,2.5+Math.sqrt(s.score||0)*0.8);
  ctx.lineCap='round';ctx.lineJoin='round';
  const now=Date.now();
  // 新手保护：半透明闪烁
  let alpha=1;
  if(s.prot){
    alpha=0.35+0.3*Math.abs(Math.sin(now/90));
    ctx.globalAlpha=alpha;
  }
  // 隐身：更透明
  if(s.fx&&s.fx.stealth>0)ctx.globalAlpha=alpha*0.35;
  // 加速：亮度表达（shadowBlur 已全局关闭，改 lighten 不增加光栅化开销）
  if(s.boost)body=lighten(body,0.25);
  // 蛇身渐变每帧创建：渐变端点必须跟随蛇头尾（缓存会导致颜色相对蛇身滑动，感知为抖动）
  const grad=ctx.createLinearGradient(h[0],h[1],pts[pts.length-1][0],pts[pts.length-1][1]);
  grad.addColorStop(0,lighten(body,isMe?0.25:0));
  grad.addColorStop(1,darken(body,0.5));
  ctx.strokeStyle=isMe?body:grad;
  ctx.lineWidth=r*2;
  ctx.beginPath();
  ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++){
    ctx.lineTo(pts[i][0],pts[i][1]);
  }
  ctx.stroke();
  // 护盾光环
  if(s.fx&&s.fx.shield>0){
    ctx.strokeStyle='rgba(8,145,178,.8)';ctx.lineWidth=2.5;
    ctx.setLineDash([7,5]);
    ctx.beginPath();ctx.arc(h[0],h[1],r+7,0,Math.PI*2);ctx.stroke();
    ctx.setLineDash([]);
  }
  if(pat==='stripe'||pat==='zebra'){
    const seg=pat==='zebra'?5:7;
    ctx.strokeStyle='rgba(255,255,255,0.55)';
    ctx.lineWidth=r*(pat==='zebra'?1.1:0.7);
    ctx.beginPath();
    for(let i=2;i<pts.length;i+=seg){
      ctx.moveTo(pts[i][0],pts[i][1]);ctx.lineTo(pts[Math.min(i+2,pts.length-1)][0],pts[Math.min(i+2,pts.length-1)][1]);
    }
    ctx.stroke();
  }else if(pat==='dot'){
    ctx.fillStyle='rgba(255,255,255,0.6)';
    for(let i=2;i<pts.length;i+=6){
      ctx.beginPath();ctx.arc(pts[i][0],pts[i][1],r*0.32,0,Math.PI*2);ctx.fill();
    }
  }
  ctx.fillStyle=lighten(body,0.3);
  ctx.beginPath();ctx.arc(h[0],h[1],r,0,Math.PI*2);ctx.fill();
  const a=Math.atan2(h[1]-(pts[1]?pts[1][1]:h[1]),h[0]-(pts[1]?pts[1][0]:h[0]));
  const ex=Math.cos(a),ey=Math.sin(a);
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(h[0]+ex*r*0.6-ey*r*0.5,h[1]+ey*r*0.6+ex*r*0.5,r*0.32,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(h[0]+ex*r*0.6+ey*r*0.5,h[1]+ey*r*0.6-ex*r*0.5,r*0.32,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#1a2332';
  ctx.beginPath();ctx.arc(h[0]+ex*r*0.75-ey*r*0.5,h[1]+ey*r*0.75+ex*r*0.5,r*0.16,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(h[0]+ex*r*0.75+ey*r*0.5,h[1]+ey*r*0.75-ex*r*0.5,r*0.16,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;
  // 名字
  const isAI=s.name&&s.name.startsWith('AI·');
  ctx.font=isAI?'11px system-ui':'12px system-ui';
  ctx.textAlign='center';
  if(isAI){
    ctx.fillStyle='rgba(92,107,128,.85)';
    ctx.fillText(s.name,h[0],h[1]-r-8);
  }else{
    ctx.fillStyle=isMe?'#059669':'rgba(26,35,50,.75)';
    ctx.fillText(s.name,h[0],h[1]-r-8);
  }
  // 长度数字（名字下方）
  ctx.font='10px system-ui';
  ctx.fillStyle='rgba(92,107,128,.7)';
  ctx.fillText('Lv.'+Math.round(s.len||12),h[0],h[1]-r-20);
  // 表情气泡
  if(s.emote&&Date.now()<s.emoteUntil){
    ctx.font='22px system-ui';
    ctx.fillText(s.emote,h[0],h[1]-r-28);
  }
  if(isMe){
    $('myLen').textContent=s.len;
  }
}

function drawMinimap(){
  // 节流：10fps 重绘（每帧 650 fillRect → 每 100ms，canvas 操作降 ~83%）
  const mt=performance.now();
  if(mt-(state._mmT||0)<100)return;
  state._mmT=mt;
  const mw=mm.clientWidth||140,mh=mm.clientHeight||140;
  if(mm.width!==mw||mm.height!==mh){mm.width=mw;mm.height=mh}
  const s=WORLD;
  mmctx.fillStyle='#eef2f8';mmctx.fillRect(0,0,mw,mh);
  mmctx.strokeStyle='rgba(225,29,72,.5)';mmctx.lineWidth=1;
  mmctx.strokeRect(1,1,mw-2,mh-2);
  const k=(mw-2)/s;
  mmctx.fillStyle='rgba(217,119,6,.7)';
  for(const f of state.foods.values()){mmctx.fillRect(f.x*k,f.y*k,1.5,1.5)}
  for(const it of state.items.values()){
    mmctx.fillStyle=ITEM_META[it.kind]?.color||'#94a3b8';
    mmctx.beginPath();mmctx.arc(it.x*k,it.y*k,2.2,0,Math.PI*2);mmctx.fill();
  }
  for(const sn of state.snakes.values()){
    mmctx.fillStyle=sn.id===state.selfId?'#059669':'rgba(26,35,50,.5)';
    mmctx.beginPath();mmctx.arc(sn.x*k,sn.y*k,sn.id===state.selfId?3:1.8,0,Math.PI*2);mmctx.fill();
  }
}

function renderLeaderboard(){
  const body=$('lbBody');
  const limit=isTouchDevice()?8:10;
  body.innerHTML=state.rank.slice(0,limit).map(r=>{
    const me=r.id===state.selfId?' lb-me':'';
    const cls=r.n<=3?'top':'';
    const isAI=r.name.startsWith('AI·');
    return `<div class="lb-row${me}"><span class="lb-n ${cls}" data-n="${r.n}">${r.n}</span><span class="lb-name${isAI?' ai':''}">${esc(r.name)}</span><span class="lb-len"><b>${Math.floor(r.score||0)}</b>分</span></div>`;
  }).join('');
}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function lighten(hex,f){
  const c=hex2rgb(hex);
  return `rgb(${Math.min(255,Math.round(c[0]+(255-c[0])*f))},${Math.min(255,Math.round(c[1]+(255-c[1])*f))},${Math.min(255,Math.round(c[2]+(255-c[2])*f))})`;
}
function darken(hex,f){
  const c=hex2rgb(hex);
  return `rgb(${Math.round(c[0]*(1-f))},${Math.round(c[1]*(1-f))},${Math.round(c[2]*(1-f))})`;
}
function hex2rgb(hex){
  const n=parseInt(hex.slice(1),16);
  return [(n>>16)&255,(n>>8)&255,n&255];
}

setInterval(()=>{
  if(!state.inGame||state.paused||!ws||ws.readyState!==1)return;
  const me=state.snakes.get(state.selfId);
  if(!me)return;
  computeInput();
  ws.send(JSON.stringify({type:'input',angle:state.selfAngle,boost:state.boosting}));
},25);

connect();
requestAnimationFrame(draw);
